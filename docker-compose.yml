services:
  db:
    image: postgres:16-alpine
    container_name: teia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teia_aranha}
      POSTGRES_USER: ${POSTGRES_USER:-teia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teia_strong_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teia} -d ${POSTGRES_DB:-teia_aranha}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teia-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      FORTIGATE_KEY: "cfdb28562ef6b75683d056266d99eb213b33599851f08be2e55770bd802e81ae"
    volumes:
      - ./backend/storage:/app/storage
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teia-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pg_data: